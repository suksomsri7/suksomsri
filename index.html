<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suksomsri — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0f1a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.06);
      --text: #e4e4e7;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 2rem 1.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #e4e4e7, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 400;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.25s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(99, 102, 241, 0.1);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.25rem;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.15rem;
    }

    .card-url {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      color: var(--text-muted);
      transition: transform 0.25s ease, color 0.25s ease;
      flex-shrink: 0;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    .icon-kanban   { background: rgba(99, 102, 241, 0.12); color: #818cf8; }
    .icon-crm      { background: rgba(16, 185, 129, 0.12); color: #34d399; }
    .icon-kb       { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
    .icon-acc      { background: rgba(236, 72, 153, 0.12); color: #f472b6; }
    .icon-food     { background: rgba(249, 115, 22, 0.12); color: #fb923c; }
    .icon-dive     { background: rgba(6, 182, 212, 0.12); color: #22d3ee; }

    .footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .container { padding: 1.5rem 1rem; }
      .logo { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

    <footer class="footer">&copy; 2026 Suksomsri</footer>

</body>
</html>
